packages:
  - "apps/*"
  - "packages/*"
overrides:
  "@modelcontextprotocol/sdk": "^1.32.0"
  body-parser: "^2.4.0"
  "brace-expansion@^1": "^1.1.21"
  "brace-expansion@^2": "^2.1.7"
  "brace-expansion@^3": "^3.0.9"
  "brace-expansion@^5": "^5.0.12"
  browserslist: "^4.28.7"
  dompurify: "^3.4.17"
  fast-uri: "^3.1.7"
  "glob@^10": "^10.5.0"
  ip-address: "^10.3.1"
  "nanoid@^3": "^3.3.20"
  "nanoid@^5": "^5.1.16"
  next: "16.4.3"
  postcss: "^8.5.18"
  proxy-addr: "^2.0.8"
  sharp: "^0.35.5"
  smol-toml: "^1.7.1"
  source-map-js: "^1.2.2"
  undici: "^7.30.1"
  vite: "^8.3.5"
  zod: "^4.6.6"
allowBuilds:
  # agents パッケージ経由の任意ネイティブ依存。Workers ランタイムでは未使用のためビルド不要。
  '@mongodb-js/zstd': false
  core-js-pure: false
  node-liblzma: false
  esbuild: false
  sharp: false
  workerd: true
  protobufjs: false
minimumReleaseAgeExclude:
  - '@next/env@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - next@16.4.3
